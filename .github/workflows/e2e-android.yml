name: e2e-android
# Runs JevClaude itself on an Android emulator. Exact-selector flows need no key; with a
# TYPESAFE_API_KEY repository secret, Jev-based steps (natural language, expect:) work too.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths: ["src/**", "examples/flows/ci-*.yaml", ".github/workflows/e2e-android.yml"]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            node dist/cli.js setup android
            node dist/cli.js doctor || true
            node dist/cli.js run examples/flows/ci-emulator-settings.yaml --junit junit.xml --html e2e-report.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: |
            e2e-report.html
            junit.xml
            reports/
