name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # GitHub release
  id-token: write # npm Trusted Publishing (OIDC) + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm ≥ 11.5.1, which Trusted Publishing needs.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - name: Check tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      # npm first tries Trusted Publishing (OIDC: Yupol02/jevclaude, release.yml). If no trusted
      # publisher matches this repository, it falls back to the NPM_TOKEN secret when one is set.
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes
