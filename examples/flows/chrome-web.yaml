# Read and use a web page in Chrome (via DevTools), language-independent: works even when Chrome
# auto-translates the page. Natural-language targets and expect: go through Jev; the search button
# is matched by its page id. Closes its tab at the end.
name: chrome web page
app: com.android.chrome
platform: android
steps:
  - open: "https://en.wikipedia.org/wiki/Istanbul" # opens a new tab
  - expect: "A Wikipedia article about the city of Istanbul is open"
  - tap: "the link about the largest cities, in the article's first paragraph"
  - expect: "A Wikipedia page about the largest cities is open"
  - back
  - expect: "The Wikipedia article about Istanbul is open again"
  - tap: { id: "web:searchIcon" }
  - wait: 600 # the search panel opens with an animation
  - type: { into: "the Wikipedia search input", text: "İstanbul Boğazı", submit: true }
  - expect: "Wikipedia shows an article or search results about the Bosphorus"
  - tap: { id: tab_switcher_button }
  - wait: 500
  - tap: "the close button of the Wikipedia tab that is about the Bosphorus"
