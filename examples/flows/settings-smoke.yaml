# Works on any Android phone: open Settings → About phone.
name: android settings smoke
app: com.android.settings
platform: android
fresh_start: true
steps:
  - launch
  - expect: "The Android Settings main list is shown"
  - tap: "the About phone / About device entry" # scrolls until it finds it
  - expect: "A screen with information about the phone (model, Android version or similar)"
  - back
